name: Build Soundify Remake

on:
  push:
    branches:
      - feature/soundify-volume-slider
    paths:
      - "soundify-project/**"
      - ".github/workflows/build-soundify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soundify-project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: soundify-remake-jar
          path: soundify-project/build/libs/*.jar
          if-no-files-found: error
